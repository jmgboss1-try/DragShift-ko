name: Build Windows app (한글판)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "install-mac-ko.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: OCR languages on this runner
        run: python -c "from dragshift import ocr; print('available:', ocr.available(), ocr.windows_languages())"

      - name: Build app folder (for the installer)
        run: pyinstaller DragShift.spec --noconfirm

      - name: Build portable DragShift.exe
        run: pyinstaller DragShift.spec --noconfirm
        env:
          ONEFILE: "1"

      - name: Windows OCR check (informational — CI runners may lack the OCR feature)
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          DRAGSHIFT_REQUIRE_OCR: "1"
        run: |
          $p = Start-Process -FilePath "dist\DragShift\DragShift.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\DragShift\log.txt" -Tail 6
          if ($p.ExitCode -ne 0) { throw "OCR check failed" }

      - name: Self-test both builds (incl. PPTX conversion)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($exe in @("dist\DragShift\DragShift.exe", "dist\DragShift.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            Get-Content "$env:LOCALAPPDATA\DragShift\log.txt" -Tail 8
            if ($p.ExitCode -ne 0) { throw "Self-test failed for $exe ($($p.ExitCode))" }
            "Self-test passed: $exe"
          }
          "{0:N1} MB portable" -f ((Get-Item dist\DragShift.exe).Length / 1MB)

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\DragShift.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          "{0:N1} MB installer" -f ((Get-Item dist\DragShift-Setup.exe).Length / 1MB)

      - name: Test the installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist\DragShift-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=contextmenu" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\DragShift\DragShift.exe"
          if (-not (Test-Path $app)) { throw "App not installed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $t = Start-Process $app -ArgumentList "--selftest" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "Installed app self-test failed" }
          Remove-Item Env:QT_QPA_PLATFORM
          $u = Start-Process "$env:LOCALAPPDATA\Programs\DragShift\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES" -Wait -PassThru
          "Installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DragShift.exe
            dist/DragShift-Setup.exe

  publish:
    needs: [windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish download (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DragShift 한글판 (최신)
          make_latest: true
          body: |
            ## 윈도우
            - **DragShift-Setup.exe** — 추천. 관리자 권한 없이 설치돼요. 시작 메뉴, 윈도우 시작 시 자동 실행, 파일 우클릭 메뉴가 생겨요.
            - **DragShift.exe** — 설치 없이 바로 실행하는 휴대용 버전.

            처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요 (서명되지 않은 프로그램이라 뜨는 경고예요).
            글자 인식(OCR)으로 한국어를 읽으려면 **설정 → 시간 및 언어 → 언어 및 지역**에 **한국어**가 추가돼 있어야 해요.

            ## 맥
            터미널에 붙여넣기:
            `curl -fsSL https://raw.githubusercontent.com/jmgboss1-try/dragshift-ko/main/install-mac-ko.sh | bash`
            (python.org 의 Python 3.13 이 먼저 설치돼 있어야 해요)

            원본: [llamaboi55/DragShift](https://github.com/llamaboi55/DragShift) (MIT) · 빌드 커밋 ${{ github.sha }}
          files: out/*
